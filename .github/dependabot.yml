version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 8
    groups:
      laravel-ecosystem:
        patterns:
          - "laravel/*"
          - "livewire/livewire"
          - "laravel-lang/*"
        update-types:
          - "minor"
          - "patch"
      filament-ecosystem:
        patterns:
          - "filament/*"
          - "guava/*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "laravel/framework"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "filament/filament"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 6
    groups:
      frontend-build:
        patterns:
          - "vite"
          - "laravel-vite-plugin"
          - "postcss"
          - "autoprefixer"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
      npm-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/docker/mysql"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 4
    groups:
      actions-nonmajor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

